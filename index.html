function computeBoard(){const R=LAY.region;CS=Math.min((R.w-20)/GW,(R.h-20)/GH);

function lEat(id){lg[id]=-1;const i=id%GW,j=(id/GW)|0;for(const[a,b]of NB){const x=i+a,y=j+b;if(x<0||y<0||x>=GW||y>=GH)continue;const n=y*GW+x;if(lg[n]>=0&&!lexp[n]){lexp[n]=1;lq[lg[n]].push(n);}}}
function runLogic(){let prog=true;while(prog){prog=false;for(const sl of active){const c=sl.c;while(sl.rem>0&&lh[c]<lq[c].length){const id=lq[c][lh[c]++];lEat(id);sl.rem--;sl.queue.push(id);prog=true;if(id in keyAt)openLocks.add(keyAt[id]);}}active=active.filter(x=>x.rem>0);}}
function cellXY(id){return[OX+(id%GW+0.5)*CS,OY+(((id/GW)|0)+0.5)*CS];}

const isLocked=t=>t.lock>=0&&!openLocks.has(t.lock);

function canTake(k){const col=columns[k];if(!col.length)return false;const t=col[0];if(isLocked(t))return false;const free=5-active.length;

 const i=id%GW,j=(id/GW)|0;for(const[a,b]of NB){const x=i+a,y=j+b;if(x>=0&&y>=0&&x<GW&&y<GH){const n=y*GW+x;if(!revealed[n]){revealed[n]=1;dirtyCells.add(n);fogDirty=true;}}}

function setPath(a,x1,y1){const x0=a.x,y0=a.y,dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1;const px=-dy/d,py=dx/d;

function bez(a,s){const u=1-s;return[u*u*a.p0[0]+2*u*s*a.p1[0]+s*s*a.p2[0],u*u*a.p0[1]+2*u*s*a.p1[1]+s*s*a.p2[1]];}

function update(dt){
 if(state==='menu')return;
 if(state==='play'&&timerOn)timer+=dt;
 for(let s=0;s<5;s++){const sl=slots[s];if(!sl)continue;const tx=slotX(s)+LAY.slotW/2,ty=LAY.slotY+LAY.slotH/2;sl.x+=(tx-sl.x)*Math.min(1,dt*14);sl.y+=(ty-sl.y)*Math.min(1,dt*14);sl.pop=Math.max(0,sl.pop-dt*4);
  sl.cd-=dt;if(sl.queue.length&&sl.cd<=0&&ants.length<140){const t=sl.queue.shift();const[cx,cy]=cellXY(t);const a={c:sl.c,x:sl.x,y:sl.y-18,cell:t,st:'go',ph:Math.random()*6,spd:(230+Math.random()*120)*LAY.antSpeed,ang:-Math.PI/2};setPath(a,cx,cy);ants.push(a);sl.cd=LV.spawn*0.7*(0.7+Math.random()*0.6);sl.pop=1;}
  if(sl.rem<=0&&!sl.queue.length)slots[s]=null;}
 for(const a of ants){a.ph+=dt*28;
  if(a.st==='chew'){a.t-=dt;if(a.t<=0){eatCell(a.cell);a.st='back';setPath(a,LAY.hole.x+(Math.random()-0.5)*18,LAY.hole.y+(Math.random()-0.5)*5);
    for(let q=0;q<4;q++)particles.push({x:a.x,y:a.y,vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*70,t:0.4,c:a.c});}continue;}
  const prev=[a.x,a.y];a.s=Math.min(1,a.s+a.spd*dt/a.len);const[bx,by]=bez(a,a.s);
  const dx=bx-prev[0],dy=by-prev[1],d=Math.hypot(dx,dy);const wig=Math.sin(a.ph*0.35)*0.9;
  a.x=bx+(d?-dy/d:0)*wig;a.y=by+(d?dx/d:0)*wig;if(d>0.01)a.ang=Math.atan2(dy,dx);
  if(a.s>=1){if(a.st==='go'){a.st='chew';a.t=0.08+Math.random()*0.1;}else a.dead=true;}}
 ants=ants.filter(a=>!a.dead);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.t-=dt;}particles=particles.filter(p=>p.t>0);
 for(const k in unlockAnim){unlockAnim[k]-=dt*1.4;if(unlockAnim[k]<=0)delete unlockAnim[k];}
 if(flash){flash.t-=dt;if(flash.t<=0)flash=null;}
 if(state==='play'&&!ants.length){
  if(eatenCount>=total){state='win';timerOn=false;prog.done[lvIndex]=1;prog.unlocked=Math.max(prog.unlocked,Math.min(LEVELS.length,lvIndex+2));
   const b=prog.best[lvIndex];firstClear=b==null;if(b==null||timer<b){prog.best[lvIndex]=timer;newBest=b!=null;}saveProgress();}
  else if(!slots.some(s=>s&&s.queue.length)&&!columns.some((c,k)=>canTake(k))){state='lose';timerOn=false;}}
}

 for(let t=0;t<3;t++){const px=LAND?(W-3*MW-40)/2+t*(MW+20):0,y0=LAND?336:148+t*215;ctx.save();ctx.translate(px,0);ZX=px;ZY=0;
